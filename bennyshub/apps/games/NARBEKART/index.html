<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NARBE Racer</title>
<!-- The page colour is set before anything else loads, so the hub never
     flashes white while the stylesheet and the engine arrive. -->
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d1b2e}</style>
<link rel="stylesheet" href="css/nk.css">
</head>
<body>

<div id="app">
  <div id="canvasWrap"></div>

  <!-- hud.js and ui.js build the HUD, the menu card and the Pause button
       themselves; main.js hides this once the game is up. -->
  <div id="loading">
    <div class="nkLogo" aria-label="NARBE Racer">
      <div class="nkLogoFlag l"></div><div class="nkLogoFlag r"></div>
      <div class="nkLogoTop">NARBE</div>
      <div class="nkLogoMain"><span>RACER</span></div>
      <div class="nkLogoStripe"></div>
    </div>
    <div class="nkTyre" aria-hidden="true"></div>
    <div class="nkLoadText">Warming up the engines…</div>
  </div>
</div>

<!-- Shared accessibility scripts. input.js MUST come before scan-manager.js:
     its window listeners have to be registered first (DESIGN §2.5). -->
<script src="../../../shared/safe-audio.js"    onerror="console.warn('safe-audio.js not loaded')"></script>
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>
<script src="js/input.js"></script>
<script src="../../../shared/scan-manager.js"  onerror="console.warn('scan-manager.js not loaded')"></script>

<!-- Engine -->
<script src="js/three.min.js"></script>
<script src="js/spline.js"></script>

<!-- Game -->
<script src="js/util.js"></script>
<script src="js/constants.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/art-items.js"></script>
<script src="js/props-sunshine.js"></script>
<script src="js/props-moonlight.js"></script>
<script src="js/roster.js"></script>
<script src="js/themes.js"></script>
<script src="js/tracks.js"></script>
<script src="js/world.js"></script>
<script src="js/items.js"></script>
<script src="js/guide.js"></script>
<script src="js/ai.js"></script>
<script src="js/race.js"></script>
<script src="js/camera.js"></script>
<script src="js/hud.js"></script>
<script src="js/controls.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
