<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benny's Show n Sound</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: #141126;
    height: 100%;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
#game { line-height: 0; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<div id="game"></div>

<!-- Phaser engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

<!-- Shared hub accessibility / audio helpers -->
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/scan-manager.js" onerror="console.warn('scan-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>

<!-- Game modules -->
<script src="js/constants.js"></script>
<script src="js/packs.js"></script>
<script src="js/wheel.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/game.js"></script>
</body>
</html>
