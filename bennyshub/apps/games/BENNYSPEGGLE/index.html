<!doctype html>
<html lang="en">
<head>
  <script src="../../../shared/usage-analytics.js" defer></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132f36">
  <title>Benny's P3GL</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../../images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../../images/favicon-16.png">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="arcade.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header" hidden>
      <a class="wordmark" href="#" id="home-link" aria-label="Benny's P3GL main menu"><span class="brand-orb" aria-hidden="true">●</span><span>BENNY'S <b>P3GL</b></span></a>
      <span class="header-note" id="header-note"></span>
    </header>
    <main id="screen" tabindex="-1"></main>
    <footer id="control-hint">Tap Space = next · hold Space = back · Enter = choose</footer>
  </div>
  <div id="modal-layer" hidden></div>
  <div id="hold-indicator" hidden role="status"><span id="hold-progress"></span><b>Keep holding to pause</b></div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script src="../../../shared/safe-audio.js"></script>
  <script src="../../../shared/voice-manager.js"></script>
  <script src="../../../shared/ios-audio-fix.js"></script>
  <script src="../../../shared/scan-manager.js"></script>
  <script src="content.js"></script>
  <script src="renderer.js"></script>
  <script src="game.js"></script>
</body>
</html>
