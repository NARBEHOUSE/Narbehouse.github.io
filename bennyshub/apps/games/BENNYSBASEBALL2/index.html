<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benny's Baseball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    background: #0a1408;
    height: 100%;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
}
#game { line-height: 0; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<div id="game"></div>

<!-- Phaser engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>

<!-- Shared hub accessibility / audio helpers -->
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/scan-manager.js" onerror="console.warn('scan-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>

<!-- Game modules -->
<script src="js/constants.js?v=72a54e21d5dc"></script>
<script src="js/player-art.js?v=a5130fe93902"></script>
<script src="js/sprites.js?v=15880629e0e5"></script>
<script src="js/audio.js?v=e5e2a1383521"></script>
<script src="js/season.js"></script>
<script src="js/ui.js?v=3797590a6326"></script>
<script src="js/fielding.js?v=86c3857ad21e"></script>
<script src="js/rendering.js"></script>
<script src="js/scenes.js?v=b633545660d7"></script>
<script src="js/movement.js?v=8998219ddbe7"></script>
<script src="js/ballpark.js?v=87e536bf85cf"></script>
<script src="js/game.js?v=114d19794681"></script>

<script>
window.addEventListener('load', () => {
    // Scale the real canvas backing store, then map logical world coordinates
    // through each scene's camera. Scale Manager zoom changes CSS size only.
    const renderScale = bb2RenderScale();
    window.__BASEBALL_RENDER_SCALE = renderScale;

    // Match text render resolution to the supersampled canvas so labels and
    // numbers are sharp too (Phaser text otherwise renders at 1x and scales up).
    const _factoryText = Phaser.GameObjects.GameObjectFactory.prototype.text;
    Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, text, style) {
        const obj = _factoryText.call(this, x, y, text, style);
        if (obj && obj.setResolution) obj.setResolution(window.__BASEBALL_RENDER_SCALE);
        return obj;
    };

    const config = {
        type: Phaser.AUTO,
        width: W * renderScale,
        height: H * renderScale,
        parent: 'game',
        backgroundColor: '#0a1408',
        render: {
            antialias: true,
            antialiasGL: true,
            roundPixels: false,
            pixelArt: false
        },
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            zoom: 1
        },
        scene: [TitleScene, SettingsScene, InstructionsScene, ColorSelectScene, SeasonScene, GameScene, ResultScene]
    };
    const game = window.__baseball2Game = new Phaser.Game(config);
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => bb2ResizeRender(game), 120);
    });
});
</script>
</body>
</html>
