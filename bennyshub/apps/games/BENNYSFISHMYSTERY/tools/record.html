<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whispering Lake — Voice Booth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#16222c; --paper:#f4efe4; --panel:#fffdf7; --line:#d9d0bd; --accent:#1d6f8a;
          --rec:#c0392b; --ok:#2e7d4f; --warn:#b3432b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, Segoe UI, Roboto, sans-serif; color:var(--ink);
         background:var(--paper); display:grid; grid-template-rows:auto auto 1fr; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--ink); color:#fff; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 10px 0 0; }
  button { font:inherit; border:0; border-radius:7px; padding:7px 12px; cursor:pointer; background:#fff; color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#ffd23f; font-weight:700; }
  button.rec { background:var(--rec); color:#fff; font-weight:700; }
  button.rec.on { animation:pulse .9s infinite; }
  @keyframes pulse { 50% { filter:brightness(1.45); } }
  #bar { display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  #meter { width:180px; height:12px; border:2px solid var(--ink); border-radius:7px; overflow:hidden; background:#fff; }
  #meterFill { height:100%; width:0; background:var(--ok); }
  .prog { font-weight:700; }
  main { overflow:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { position:sticky; top:0; background:var(--panel); z-index:2; box-shadow:0 1px 0 var(--line); }
  tr.sel { background:#e2eef2; }
  tr.done td:first-child { color:var(--ok); font-weight:700; }
  td.cue { font:12px/1.4 ui-monospace, Consolas, monospace; color:#556; white-space:nowrap; }
  td.who { white-space:nowrap; font-size:13px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:9px; background:#e8e2d2; font-size:12px; }
  .walt .badge { background:#d3e8f4; } .you .badge { background:#d9efd3; } .sfx .badge { background:#f4e2d3; }
  .rowbtns { display:flex; gap:6px; }
  .hint { color:#667; font-size:13px; }
  #status { margin-left:auto; font-size:13px; opacity:.9; }
  .quiet { color:#889; }
</style>
</head>
<body>
<header>
  <h1>Voice Booth — Whispering Lake</h1>
  <button id="pick" class="primary">Choose the audio/vo folder…</button>
  <button id="mic">Turn the microphone on</button>
  <span id="status">Nothing recorded yet.</span>
</header>

<div id="bar">
  <button id="recBtn" class="rec" disabled>● Record  <span class="hint">(R)</span></button>
  <button id="playBtn" disabled>▶ Play  <span class="hint">(space)</span></button>
  <button id="saveBtn" class="primary" disabled>Save  <span class="hint">(S)</span></button>
  <button id="ttsBtn">Hear the system voice</button>
  <div id="meter"><div id="meterFill"></div></div>
  <label><input type="checkbox" id="onlyTodo"> only the ones still to do</label>
  <span class="prog" id="prog"></span>
</div>

<main><table id="list"><thead><tr>
  <th style="width:44px"></th><th style="width:150px">Cue</th><th style="width:110px">Who</th><th>Line</th><th style="width:220px"></th>
</tr></thead><tbody id="rows"></tbody></table></main>

<script src="../js/content.generated.js"></script>
<script>
/**
 * The voice booth.
 *
 * Every line the game says, in the order it says it, one row each. Record a
 * row, listen back, save it — and the game plays your recording instead of the
 * system voice from then on. Anything you have not recorded stays TTS, so the
 * game is fully voiced the whole way through and simply gets better as you go.
 *
 * WHERE THE FILES GO. Pick the game's audio/vo folder once (Chrome or Edge)
 * and every save writes straight into it, along with index.json - the manifest
 * js/util.js reads to know which cues are recorded. No downloads folder, no
 * moving files by hand. In a browser without the File System Access API the
 * Save button downloads the clip and tells you where to put it.
 *
 * ADDING A CHARACTER OR A SOUND. Rows come from content/quests.json (Walt's
 * cue ids, your replies, the nudges). Anything with a cue id shows up here, so
 * a new character's lines appear the moment they are written into the content.
 */
(function () {
  'use strict';
  const C = window.RT && RT.content;
  if (!C || !C.quests) { document.body.innerHTML = '<p style="padding:24px">Run <code>python tools/build_content.py</code> first.</p>'; return; }

  /* ── The script, in the order the game reads it ─────────────────────── */
  const SMALL_TALK = [
    ['you_whatdoyouneed', 'What do you need?'],
    ['you_listening', "I'm listening."],
    ['you_goon', 'Go on.'],
    ['you_right', 'Right.'],
    ['you_deal', 'Deal'],
    ['you_ringit', 'Ring it'],
  ];
  const walt = C.quests.walt || {};
  const lines = [];
  const seen = {};
  const add = (cue, who, text, ctx) => {
    if (!cue || !text || seen[cue]) return;
    seen[cue] = 1;
    lines.push({ cue, who, text, ctx });
  };

  (C.quests.quests || []).forEach(function (q, i) {
    const label = 'Job ' + (i + 1) + ' · ' + q.title;
    const brief = (q.lines && q.lines.brief) || [];
    brief.forEach(function (cue, k) {
      add(cue, 'walt', walt[cue] || '', label + ' — briefing ' + (k + 1) + ' of ' + brief.length);
      // Your answer comes between his lines, exactly as the game plays it.
      if (k < brief.length - 1) {
        if (k === 0 && q.player) add(q.id + '_you', 'you', q.player, label + ' — your answer');
      }
    });
    ((q.lines && q.lines.done) || []).forEach(function (cue) {
      add(cue, 'walt', walt[cue] || '', label + ' — when you hand it in');
    });
    if (q.say && q.say.nudge) add(q.id + '_nudge', 'walt', q.say.nudge, label + ' — a nudge if you are stuck');
  });
  SMALL_TALK.forEach(([cue, text]) => add(cue, 'you', text, 'Said in every conversation'));
  // Any Walt cue the quests do not reach (a line written ahead of its scene).
  Object.keys(walt).forEach(cue => add(cue, 'walt', walt[cue], 'Written, not yet placed'));

  /* ── State ───────────────────────────────────────────────────────────── */
  const $ = (id) => document.getElementById(id);
  let dir = null;             // the audio/vo folder handle
  let manifest = { lines: {} };
  let stream = null, rec = null, chunks = [], blob = null, blobUrl = null;
  let sel = 0, recording = false;

  const fileFor = (cue) => cue + '.webm';
  const isDone = (cue) => !!manifest.lines[cue];

  function status(msg) { $('status').textContent = msg; }
  function progress() {
    const n = lines.filter(l => isDone(l.cue)).length;
    $('prog').textContent = n + ' of ' + lines.length + ' recorded';
  }

  /* ── The list ────────────────────────────────────────────────────────── */
  function render() {
    const onlyTodo = $('onlyTodo').checked;
    const body = $('rows');
    body.innerHTML = '';
    lines.forEach(function (l, i) {
      if (onlyTodo && isDone(l.cue)) return;
      const tr = document.createElement('tr');
      tr.className = l.who + (i === sel ? ' sel' : '') + (isDone(l.cue) ? ' done' : '');
      tr.innerHTML =
        '<td>' + (isDone(l.cue) ? '✔' : '') + '</td>' +
        '<td class="cue">' + l.cue + '</td>' +
        '<td class="who"><span class="badge">' + (l.who === 'walt' ? 'Walt' : 'You') + '</span></td>' +
        '<td>' + esc(l.text) + '<div class="hint quiet">' + esc(l.ctx || '') + '</div></td>' +
        '<td><div class="rowbtns">' +
          '<button data-act="sel" data-i="' + i + '">Select</button>' +
          (isDone(l.cue) ? '<button data-act="hear" data-i="' + i + '">Hear it</button>' +
                           '<button data-act="del" data-i="' + i + '">Remove</button>' : '') +
        '</div></td>';
      body.appendChild(tr);
    });
    Array.from(body.querySelectorAll('button')).forEach(function (b) {
      b.onclick = () => rowAction(b.dataset.act, +b.dataset.i);
    });
    progress();
    const l = lines[sel];
    $('recBtn').disabled = !stream;
    $('playBtn').disabled = !blob;
    $('saveBtn').disabled = !blob || !l;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  function rowAction(act, i) {
    sel = i;
    if (act === 'sel') { dropTake(); render(); status('Ready: ' + lines[i].cue); return; }
    if (act === 'hear') { hearSaved(lines[i]); return; }
    if (act === 'del') { removeSaved(lines[i]); return; }
  }

  /* ── The microphone ──────────────────────────────────────────────────── */
  $('mic').onclick = async function () {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      meterFrom(stream);
      $('mic').textContent = 'Microphone is on';
      $('mic').disabled = true;
      status('Microphone ready. Pick a line and press Record.');
      render();
    } catch (e) { status('No microphone: ' + e.message); }
  };

  function meterFrom(st) {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(st);
      const an = ac.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      const buf = new Uint8Array(an.frequencyBinCount);
      (function tick() {
        an.getByteTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128) / 128);
        $('meterFill').style.width = Math.min(100, peak * 160).toFixed(0) + '%';
        $('meterFill').style.background = peak > 0.92 ? 'var(--warn)' : 'var(--ok)';
        requestAnimationFrame(tick);
      })();
    } catch (e) { /* no meter, no matter */ }
  }

  function dropTake() {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blob = null; blobUrl = null;
  }

  $('recBtn').onclick = function () {
    if (!stream) return;
    if (recording) { rec.stop(); return; }
    dropTake();
    chunks = [];
    rec = new MediaRecorder(stream, { mimeType: pickMime() });
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function () {
      recording = false;
      $('recBtn').classList.remove('on');
      $('recBtn').innerHTML = '● Record  <span class="hint">(R)</span>';
      blob = new Blob(chunks, { type: rec.mimeType });
      blobUrl = URL.createObjectURL(blob);
      status('Recorded ' + (blob.size / 1024).toFixed(0) + ' KB. Listen back, then Save.');
      render();
      new Audio(blobUrl).play().catch(() => {});
    };
    rec.start();
    recording = true;
    $('recBtn').classList.add('on');
    $('recBtn').innerHTML = '■ Stop  <span class="hint">(R)</span>';
    status('Recording “' + lines[sel].cue + '” — press R or click Stop when you are done.');
  };
  function pickMime() {
    const want = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    return want.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  $('playBtn').onclick = () => { if (blobUrl) new Audio(blobUrl).play(); };
  $('ttsBtn').onclick = function () {
    const l = lines[sel];
    if (!l || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(l.text));
  };

  /* ── Where the files live ────────────────────────────────────────────── */
  $('pick').onclick = async function () {
    if (!window.showDirectoryPicker) {
      status('This browser cannot write to a folder. Saves will download instead — put them in audio/vo/.');
      return;
    }
    try {
      dir = await window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' });
      await loadManifest();
      $('pick').textContent = 'Folder: ' + dir.name;
      status('Saving into ' + dir.name + '/. ' + Object.keys(manifest.lines).length + ' already recorded.');
      render();
    } catch (e) { status('No folder chosen.'); }
  };

  async function loadManifest() {
    manifest = { lines: {} };
    try {
      const fh = await dir.getFileHandle('index.json');
      const txt = await (await fh.getFile()).text();
      const doc = JSON.parse(txt);
      manifest = { lines: (doc && doc.lines) || {} };
    } catch (e) { /* a fresh folder */ }
  }

  async function writeManifest() {
    if (!dir) return;
    const fh = await dir.getFileHandle('index.json', { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify({
      _what: 'Which cue ids have a recording, and the file for each. Written by tools/record.html; anything not listed here is spoken by the system voice.',
      lines: manifest.lines
    }, null, 1) + '\n');
    await w.close();
  }

  $('saveBtn').onclick = async function () {
    const l = lines[sel];
    if (!blob || !l) return;
    const name = fileFor(l.cue);
    if (!dir) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      status('Downloaded ' + name + '. Put it in audio/vo/ and add it to index.json.');
      return;
    }
    try {
      const fh = await dir.getFileHandle(name, { create: true });   // overwrites a re-record
      const w = await fh.createWritable();
      await w.write(blob);
      await w.close();
      manifest.lines[l.cue] = name;
      await writeManifest();
      dropTake();
      status('Saved ' + name + '.');
      // Straight on to the next one still to do, so a session flows.
      const next = lines.findIndex((x, i) => i > sel && !isDone(x.cue));
      sel = next >= 0 ? next : sel;
      render();
      const row = document.querySelector('tr.sel');
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'center' });
    } catch (e) { status('Could not save: ' + e.message); }
  };

  async function hearSaved(l) {
    if (!dir) { status('Choose the audio/vo folder first.'); return; }
    try {
      const fh = await dir.getFileHandle(manifest.lines[l.cue]);
      const url = URL.createObjectURL(await fh.getFile());
      const a = new Audio(url);
      a.onended = () => URL.revokeObjectURL(url);
      a.play();
    } catch (e) { status('That file is missing: ' + e.message); }
  }

  async function removeSaved(l) {
    if (!dir) return;
    if (!confirm('Remove the recording of ' + l.cue + '? The game will speak it with the system voice again.')) return;
    try { await dir.removeEntry(manifest.lines[l.cue]); } catch (e) { /* already gone */ }
    delete manifest.lines[l.cue];
    await writeManifest();
    status('Removed ' + l.cue + '.');
    render();
  }

  /* ── Keys, so a session can be run without the mouse ─────────────────── */
  document.addEventListener('keydown', function (e) {
    if (/input|textarea/i.test((e.target.tagName || ''))) return;
    const k = e.key.toLowerCase();
    if (k === 'r') { e.preventDefault(); $('recBtn').click(); }
    else if (k === ' ') { e.preventDefault(); $('playBtn').click(); }
    else if (k === 's') { e.preventDefault(); $('saveBtn').click(); }
    else if (k === 'arrowdown') { e.preventDefault(); sel = Math.min(lines.length - 1, sel + 1); dropTake(); render(); }
    else if (k === 'arrowup') { e.preventDefault(); sel = Math.max(0, sel - 1); dropTake(); render(); }
  });
  $('onlyTodo').onchange = render;

  render();
  status(lines.length + ' lines to record. Choose the audio/vo folder, turn the microphone on, and press R.');
})();
</script>
</body>
</html>
