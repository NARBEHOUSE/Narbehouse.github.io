<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Switch Stories</title>

<body>

<div id="nss" data-screen="library"></div>

<!-- Remove faint detached pixels before drawing clean high-contrast outlines. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="nss-cvi-silhouette" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="solid"><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer>
      <feMorphology in="solid" operator="erode" radius="1" result="core"/>
      <feMorphology in="core" operator="dilate" radius="1" result="clean"/>
      <feComposite in="SourceGraphic" in2="clean" operator="in"/>
    </filter>
  </defs>
</svg>

<!-- Shared hub modules, in the hub's required order, before any game script. -->
<script src="../../../shared/safe-audio.js" onerror="console.warn('safe-audio.js not loaded')"></script>
<script src="../../../shared/platform.js"></script>
<script src="../../../shared/scan-status-badge.js"></script>
<script src="../../../shared/choice-scan.js"></script>
<script src="../../../shared/choice-scan-adapter.js"></script>
<link rel="stylesheet" href="../../../shared/scan-status-badge.css">
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/scan-manager.js" onerror="console.warn('scan-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>

<!-- Game modules. config.js holds every easy-to-change number, word and option. -->
<script src="js/config.js?v=2026.10.30.2"></script>
<script src="js/settings.js?v=2026.10.30.2"></script>
<script src="js/reading-history.js?v=2026.10.30.2"></script>

<!-- The list of stories. Each story's own story.js is loaded from it. -->
